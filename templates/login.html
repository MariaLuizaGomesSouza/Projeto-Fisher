{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <section class="auth-lado">
        <div class="auth-card">

            <div class="auth-header">
                <h2>Bem-vindo de volta</h2>
                <p>Entre para acessar o painel do Projeto Fisher.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="seu@email.com"
                               autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" name="senha" placeholder="Sua senha"
                               autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Entrar no sistema</button>

            </form>

            <div class="auth-footer">
                Ainda não tem conta?
                <a href="{{ url_for('auth.registrar') }}">Criar nova conta</a>
            </div>

        </div>
    </section>
</div>
{% endblock %}
