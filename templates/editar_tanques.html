{% extends "base.html" %}

{% block content %}
    <h2>Editar Tanque: {{ tanque.nome }}</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nome do Tanque:</label><br>
            <input type="text" name="nome" value="{{ tanque.nome }}" required style="padding: 5px; width: 300px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Espécie:</label><br>
            <input type="text" name="especie" value="{{ tanque.especie }}" required style="padding: 5px; width: 300px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Quantidade de Peixes:</label><br>
            <input type="number" name="quantidade" value="{{ tanque.quantidade }}" required style="padding: 5px; width: 300px;">
        </div>
        
        <button type="submit" style="padding: 8px 15px; background-color: #004d40; color: white; border: none; cursor: pointer;">Salvar Alterações</button>
    </form>
    
    <br>
    <a href="{{ url_for('listar_tanques') }}">Cancelar e Voltar</a>
{% endblock %}
