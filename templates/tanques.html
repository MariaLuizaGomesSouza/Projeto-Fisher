{% extends "base.html" %}

{% block content %}

<section class="page-section">

    <div class="page-header">

        <h1>
            Meus Tanques
        </h1>

        <a
            href="{{ url_for('cadastrar_tanque') }}"
            class="btn-primary">

            + Novo Tanque

        </a>

    </div>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Quantidade</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody>

                {% for tanque in tanques %}

                <tr>

                    <td>
                        {{ tanque.nome }}
                    </td>

                    <td>
                        {{ tanque.especie }}
                    </td>

                    <td>
                        {{ tanque.quantidade }}
                    </td>

                    <td class="actions">

                        <a
                            href="{{ url_for('biometria', tanque_id=tanque.id) }}">

                            Biometria

                        </a>

                        <a
                            href="{{ url_for('editar_tanque', tanque_id=tanque.id) }}">

                            Editar

                        </a>

                        <form
                            action="{{ url_for('deletar_tanque', tanque_id=tanque.id) }}"
                            method="POST">

                            <button
                                type="submit"
                                onclick="return confirm('Tem certeza que deseja apagar este tanque?');">

                                Deletar

                            </button>

                        </form>

                    </td>

                </tr>

                {% else %}

                <tr>

                    <td
                        colspan="4"
                        class="empty-message">

                        Nenhum tanque cadastrado ainda.

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</section>

{% endblock %}
