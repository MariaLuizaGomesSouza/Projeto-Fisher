{% extends "base.html" %}

{% block content %}
    <h2>Cadastrar Novo Tanque</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nome do Tanque:</label><br>
            <input type="text" name="nome" required style="padding: 5px; width: 300px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Espécie:</label><br>
            <input type="text" name="especie" required style="padding: 5px; width: 300px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Quantidade de Peixes:</label><br>
            <input type="number" name="quantidade" required style="padding: 5px; width: 300px;">
        </div>
        
        <button type="submit" style="padding: 8px 15px; background-color: #004d40; color: white; border: none; cursor: pointer;">Cadastrar Tanque</button>
    </form>
    
    <br>
    <a href="{{ url_for('listar_tanques') }}">Voltar para a Lista</a>
{% endblock %}
