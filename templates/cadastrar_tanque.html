{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Cadastrar Tanque</h2>
    <form action="{{ url_for('cadastrar_tanque') }}" method="POST">
        <div class="form-group">
            <label for="nome">Nome / Identificação do Tanque</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Tanque Escavado 01" required>
        </div>
        
        <div class="form-group">
            <label for="especie">Espécie dos Peixes</label>
            <input type="text" id="especie" name="especie" placeholder="Ex: Tilápia do Nilo" required>
        </div>

        <div class="form-group">
            <label for="quantidade">Quantidade de Peixes</label>
            <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 1500" required>
        </div>

        <button type="submit" class="btn">Salvar Tanque</button>
    </form>
</div>
{% endblock %}
