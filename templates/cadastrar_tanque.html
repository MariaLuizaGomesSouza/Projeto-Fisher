{% extends "base.html" %}

{% block conteudo %}

<h2>Cadastro de Tanque</h2>

<p>
    Cadastre um novo tanque para controlar
    a produção de peixes.
</p>

<form method="POST">

    <label for="nome">
        Nome do tanque:
    </label>

    <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Ex: Tanque 01"
        required
    >

    <label for="especie">
        Espécie dos peixes:
    </label>

    <input
        type="text"
        id="especie"
        name="especie"
        placeholder="Ex: Tambaqui"
        required
    >

    <label for="quantidade">
        Quantidade de peixes:
    </label>

    <input
        type="number"
        id="quantidade"
        name="quantidade"
        min="1"
        placeholder="Ex: 1000"
        required
    >

    <button type="submit">
        Cadastrar tanque
    </button>

</form>

{% endblock %}
