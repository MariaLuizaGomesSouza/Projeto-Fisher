{% extends "base.html" %}

{% block content %}

<section class="page-section">


    <div class="page-header">

        <h1>
            Editar Tanque
        </h1>

        <p>
            Alterando informações de: <strong>{{ tanque.nome }}</strong>
        </p>

    </div>


    <form
        method="POST"
        class="tank-form"
    >


        <div class="form-group">

            <label for="nome">
                Nome do Tanque:
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ tanque.nome }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="especie">
                Espécie:
            </label>

            <input
                type="text"
                id="especie"
                name="especie"
                value="{{ tanque.especie }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="quantidade">
                Quantidade de Peixes:
            </label>

            <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                value="{{ tanque.quantidade }}"
                required
            >

        </div>


        <div class="form-buttons">

            <button
                type="submit"
                class="btn-primary"
            >

                <i class="fa-solid fa-check"></i>

                Salvar Alterações

            </button>


            <a
                href="{{ url_for('listar_tanques') }}"
                class="btn-secondary"
            >

                Cancelar

            </a>

        </div>


    </form>


</section>

{% endblock %}
