<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto Fisher - Gestão de Piscicultura</title>
    
    <!-- CONEXÃO COM O ARQUIVO CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <div>
            <a href="{{ url_for('index') }}" class="logo">🐟 Projeto Fisher</a>
        </div>

        <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('listar_tanques') }}">Meus Tanques</a>
                <a href="{{ url_for('cadastrar_tanque') }}">Cadastrar Tanque</a>
                <span style="color: #a7ffeb; margin-right: 15px;">| Olá, {{ current_user.nome }}!</span>
                <a href="{{ url_for('logout') }}" style="color: #ff5252; font-weight: bold;">Sair</a>
            {% else %}
                <a href="{{ url_for('login') }}">Entrar</a>
                <a href="{{ url_for('registrar') }}">Criar Conta</a>
            {% endif %}
        </div>
    </nav>

    <!-- ÁREA VAZIA ONDE AS OUTRAS PÁGINAS SERÃO INJETADAS -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
