<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Fisher - Gestão Agrícola</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">🐟 Fisher</div>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('listar_tanques') }}">Tanques</a>
            <a href="{{ url_for('cadastrar_tanque') }}">Novo Tanque</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        <div class="card">
            <h1>Bem-vindo ao Sistema Fisher</h1>
            <p style="color: var(--text-muted);">Gerencie a biometria dos peixes e otimize o consumo de ração dos seus tanques.</p>
            <br>
            <a href="{{ url_for('cadastrar_tanque') }}" class="btn">Cadastrar Novo Tanque</a>
        </div>
        {% endblock %}
    </main>
</body>
</html>
